<!DOCTYPE html>
<html lang="{{ site.LanguageCode }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }}{{ with .Params.event }} — {{ . }}{{ end }}</title>
  <meta name="description" content="{{ .Description }}">

  <!-- Reveal.js core -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">

  <style>
    /* ── CSS variables (matches site theme) ───────────────────── */
    :root {
      --bg-primary:      #0d1117;
      --bg-secondary:    #161b22;
      --bg-tertiary:     #21262d;
      --text-primary:    #e6edf3;
      --text-secondary:  #8b949e;
      --accent-primary:  #58a6ff;
      --accent-secondary:#3fb950;
      --accent-warning:  #d29922;
      --accent-danger:   #f85149;
      --border-primary:  #30363d;
      --border-subtle:   #21262d;
      --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }

    /* ── Reveal.js overrides ───────────────────────────────────── */
    .reveal-viewport { background: var(--bg-primary); }

    .reveal {
      font-family: var(--font-body);
      font-size: 20px;
      color: var(--text-primary);
    }

    .reveal .slides section {
      text-align: left;
      height: 100%;
      box-sizing: border-box;
      padding: 3rem 3.5rem;
    }

    /* Headings */
    .reveal h1, .reveal h2 {
      font-family: var(--font-body);
      font-weight: 700;
      color: var(--text-primary);
      text-transform: none;
      letter-spacing: -0.01em;
      margin-top: 0;
      margin-bottom: 0.4rem;
      line-height: 1.2;
    }
    .reveal h2 { font-size: 1.75rem; }
    .reveal h3 {
      font-family: var(--font-body);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-secondary);
      margin-top: 0;
      margin-bottom: 0.6rem;
    }

    .reveal p {
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: 0.75rem;
      max-width: 680px;
    }

    .reveal ul {
      color: var(--text-secondary);
      line-height: 1.8;
      padding-left: 1.25rem;
      max-width: 660px;
      display: block;
      margin: 0 0 0.75rem;
    }
    .reveal li { margin-bottom: 0.25rem; }

    /* Controls & progress */
    .reveal .controls { color: var(--accent-primary); }
    .reveal .progress  { color: var(--accent-primary); height: 3px; }
    .reveal .slide-number {
      background: transparent;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      bottom: 1rem;
      right: 1.25rem;
    }

    /* ── Slide label (eyebrow text) ────────────────────────────── */
    .slide-label {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }

    /* ── Slack / OpsGenie alert mockup ────────────────────────── */
    /*   Light card mimicking a real Slack attachment             */
    .slack-mockup {
      background: #1e2328;          /* Slack dark message pane */
      border-radius: 6px;
      padding: 0.75rem 1rem 0.75rem 0.9rem;
      max-width: 600px;
      margin: 0.75rem 0;
      font-family: var(--font-body);
      font-size: 0.8rem;
      line-height: 1.5;
      color: #d1d2d3;               /* Slack dark text */
    }
    /* App name + timestamp row */
    .slack-mockup__header {
      display: flex;
      align-items: baseline;
      gap: 0.45rem;
      margin-bottom: 0.5rem;
      font-size: 0.8rem;
    }
    /* "OpsGenie" app name bold */
    .slack-mockup__header > span:first-of-type {
      font-weight: 700;
      color: #e8e8e8;
    }
    /* APP badge — small "APP" pill next to sender name */
    .slack-mockup__badge {
      background: transparent;
      color: #ababad;
      font-size: 0.62rem;
      font-weight: 400;
      padding: 0.05rem 0.35rem;
      border-radius: 3px;
      border: 1px solid #565859;
      letter-spacing: 0;
      vertical-align: middle;
    }
    .slack-mockup__time {
      color: #ababad;
      font-size: 0.72rem;
    }
    /* The attachment card itself */
    .slack-mockup__title {
      /* OpsGenie attachment: left orange stripe + white card */
      background: #222529;
      border-left: 3px solid #E8664E;   /* OpsGenie alert orange */
      border-radius: 0 4px 4px 0;
      padding: 0.75rem 1rem;
      font-size: 0.82rem;
      font-weight: 700;
      color: #e8e8e8;
      margin-bottom: 0;
    }
    /* Fields inside the attachment card */
    .slack-mockup__row {
      background: #222529;
      border-left: 3px solid #E8664E;
      border-radius: 0;
      padding: 0 1rem 0.1rem;
      display: grid;
      grid-template-columns: 9rem 1fr;
      gap: 0 0.5rem;
      font-size: 0.76rem;
    }
    .slack-mockup__row:last-of-type {
      border-radius: 0 0 4px 0;
      padding-bottom: 0.65rem;
    }
    .slack-mockup__key {
      color: #ababad;
      font-weight: 400;
    }
    .slack-mockup__val {
      color: #d1d2d3;
      font-weight: 400;
    }
    .slack-mockup__divider {
      background: #222529;
      border-left: 3px solid #E8664E;
      border-top: 1px solid #36383b;
      margin: 0;
      padding: 0.5rem 1rem 0.15rem;
      height: 0;
    }
    /* Connected signals inside the card */
    .slack-mockup__signal {
      background: #222529;
      border-left: 3px solid #E8664E;
      padding: 0 1rem 0.15rem;
      font-size: 0.76rem;
      color: #57a86b;               /* Slack green for positive signals */
      display: block;
    }
    .slack-mockup__signal:last-of-type {
      padding-bottom: 0.65rem;
      border-radius: 0 0 4px 0;
    }
    /* Action buttons — Slack's flat pill style */
    .slack-mockup__actions {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.55rem;
      flex-wrap: wrap;
    }
    .slack-mockup__action-btn {
      background: #2c2e33;
      color: #d1d2d3;
      border: 1px solid #565859;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 400;
      padding: 0.3rem 0.85rem;
      font-family: var(--font-body);
      cursor: default;
      line-height: 1.4;
    }
    .slack-mockup__action-btn--secondary {
      background: #2c2e33;
      color: #d1d2d3;
      border: 1px solid #565859;
    }

    /* ── Reality box — GuardDuty Slack style ──────────────────── */
    /*   Mimics an AWS GuardDuty finding in dark-mode Slack       */
    .guardduty-box {
      background: #222529;           /* Slack dark attachment bg */
      border: none;
      border-left: 4px solid #C4313A; /* GuardDuty finding red  */
      border-radius: 0 4px 4px 0;
      padding: 0.8rem 1rem;
      font-family: var(--font-body);
      font-size: 0.78rem;
      line-height: 1.55;
      color: #ababad;                /* muted field-value text   */
      max-width: 520px;
      margin: 0.75rem 0;
    }
    /* Severity pill — "Medium · AWS · IAM" */
    .guardduty-box__label {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0;
      text-transform: none;
      color: #E87722;                /* Medium severity orange   */
      background: rgba(232, 119, 34, 0.12);
      border: 1px solid rgba(232, 119, 34, 0.3);
      border-radius: 3px;
      padding: 0.08rem 0.45rem;
      margin-bottom: 0.55rem;
    }
    /* Finding title and field labels share <strong> — make them stand out */
    .guardduty-box strong {
      color: #e8e8e8;
      font-weight: 600;
    }
    /* First <strong> (the finding title) gets blue link treatment */
    .guardduty-box div:nth-child(2) strong {
      color: #4994EC;               /* Slack's blue link color   */
      font-weight: 700;
      font-size: 0.82rem;
    }
    /* Field rows: label bold + value muted on same line */
    .guardduty-box div:not(:nth-child(1)):not(:nth-child(2)) {
      font-size: 0.75rem;
      border-top: 1px solid #2e3136;
      padding-top: 0.3rem;
    }

    /* ── Two-column split ──────────────────────────────────────── */
    .slide-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      margin-top: 0.75rem;
    }
    .slide-split__col-label {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }
    .slide-split__col-label--good { color: var(--accent-secondary); }
    .slide-split__col-label--bad  { color: var(--accent-warning); }

    /* ── Coverage / log-source grid ───────────────────────────── */
    .coverage-grid {
      border: 1px solid var(--border-primary);
      border-radius: 6px;
      overflow: hidden;
      font-size: 0.76rem;
      font-family: var(--font-mono);
      max-width: 580px;
      margin: 0.85rem 0;
    }
    .coverage-grid__row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      border-bottom: 1px solid var(--border-subtle);
    }
    .coverage-grid__row:last-child { border-bottom: none; }
    .coverage-grid__row--header {
      background: var(--bg-tertiary);
      font-weight: 700;
      color: var(--text-secondary);
      font-size: 0.66rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .coverage-grid__cell {
      padding: 0.4rem 0.65rem;
      color: var(--text-primary);
      border-right: 1px solid var(--border-subtle);
    }
    .coverage-grid__cell:last-child { border-right: none; }
    .coverage-grid__cell--ok   { color: var(--accent-secondary); }
    .coverage-grid__cell--warn { color: var(--accent-warning); }
    .coverage-grid__cell--bad  { color: var(--accent-danger); }

    /* ── IOC timeline ──────────────────────────────────────────── */
    .slide-timeline {
      display: flex;
      align-items: flex-start;
      margin: 1rem 0;
      max-width: 640px;
    }
    .slide-timeline__step {
      flex: 1;
      text-align: center;
      position: relative;
    }
    .slide-timeline__step:not(:last-child)::after {
      content: '';
      position: absolute;
      top: 11px;
      right: -50%;
      width: 100%;
      height: 2px;
      background: var(--border-primary);
      z-index: 0;
    }
    .slide-timeline__dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--bg-tertiary);
      border: 2px solid var(--border-primary);
      margin: 0 auto 0.45rem;
      position: relative;
      z-index: 1;
    }
    .slide-timeline__dot--danger { background: var(--accent-danger);  border-color: var(--accent-danger); }
    .slide-timeline__dot--warn   { background: var(--accent-warning); border-color: var(--accent-warning); }
    .slide-timeline__label {
      font-size: 0.68rem;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      line-height: 1.4;
    }
    .slide-timeline__duration {
      font-size: 0.62rem;
      color: var(--accent-warning);
      margin-top: 0.2rem;
    }

    /* ── SIEM alert cards ──────────────────────────────────────── */
    .siem-cards {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin: 0.85rem 0;
    }
    .siem-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      border-radius: 6px;
      padding: 0.75rem 0.9rem;
      font-family: var(--font-mono);
      font-size: 0.73rem;
      flex: 1;
      min-width: 150px;
      max-width: 200px;
      line-height: 1.55;
    }
    .siem-card__source {
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
      margin-bottom: 0.35rem;
    }
    .siem-card__title {
      color: var(--text-primary);
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    .siem-card__detail { color: var(--text-secondary); }
    .siem-cards__arrow {
      font-size: 1.1rem;
      color: var(--accent-primary);
      flex-shrink: 0;
    }

    /* ── Alert queue ───────────────────────────────────────────── */
    .alert-queue {
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-width: 480px;
      margin: 0.85rem 0;
      max-height: 185px;
      overflow: hidden;
      position: relative;
    }
    .alert-queue::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 50px;
      background: linear-gradient(transparent, var(--bg-primary));
    }
    .alert-queue__item {
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: 3px;
      padding: 0.25rem 0.65rem;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-secondary);
      display: flex;
      gap: 0.65rem;
    }
    .alert-queue__item--critical {
      border-color: var(--accent-danger);
      background: rgba(248, 81, 73, 0.07);
      color: var(--text-primary);
    }
    .alert-queue__num {
      color: var(--text-secondary);
      min-width: 2rem;
      opacity: 0.5;
    }

    /* ── Formula block ─────────────────────────────────────────── */
    .formula-block {
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      border-radius: 6px;
      padding: 0.9rem 1.1rem;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: var(--text-primary);
      max-width: 460px;
      margin: 0.85rem 0;
      line-height: 1.8;
    }
    .formula-block__result {
      color: var(--accent-primary);
      font-weight: 700;
      border-top: 1px solid var(--border-subtle);
      margin-top: 0.4rem;
      padding-top: 0.4rem;
    }

    /* ── Gap summary table ─────────────────────────────────────── */
    .gap-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
      margin: 0.85rem 0;
      max-width: 680px;
    }
    .gap-table th {
      text-align: left;
      padding: 0.45rem 0.8rem;
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      font-size: 0.66rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border-bottom: 1px solid var(--border-primary);
      font-family: var(--font-body);
    }
    .gap-table td {
      padding: 0.55rem 0.8rem;
      border-bottom: 1px solid var(--border-subtle);
      vertical-align: top;
      color: var(--text-primary);
    }
    .gap-table tr:last-child td { border-bottom: none; }
    .gap-table__feature { font-family: var(--font-mono); font-size: 0.76rem; }
    .gap-table__req     { color: var(--text-secondary); }
    .gap-table__reality--rare    { color: var(--accent-danger);  font-weight: 600; }
    .gap-table__reality--partial { color: var(--accent-warning); font-weight: 600; }

    /* ── Closing callout ───────────────────────────────────────── */
    .slide-callout {
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      border-left: 4px solid var(--accent-primary);
      border-radius: 6px;
      padding: 1rem 1.3rem;
      font-size: 0.92rem;
      color: var(--text-primary);
      max-width: 660px;
      margin: 1.25rem 0 0;
      line-height: 1.65;
      font-style: italic;
    }
  </style>
</head>
<body>

<div class="reveal">
  <div class="slides" id="deck-slides">
    <!-- populated by JS below -->
  </div>
</div>

<!-- Hugo-rendered content: hidden, split by JS -->
<div id="deck-source" style="display:none">{{ block "main" . }}{{ end }}</div>

<!-- Reveal.js -->
<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
<script>
(function () {
  var raw    = document.getElementById('deck-source').innerHTML;
  var slides = document.getElementById('deck-slides');

  // Split on <!-- slide --> sentinels (case-insensitive, optional whitespace)
  var parts = raw.split(/<!--\s*slide\s*-->/i);

  parts.forEach(function (html) {
    html = html.trim();
    if (!html) return;
    var section = document.createElement('section');
    section.innerHTML = html;
    slides.appendChild(section);
  });

  Reveal.initialize({
    hash:        true,
    slideNumber: 'c/t',
    transition:  'fade',
    transitionSpeed: 'fast',
    controls:    true,
    progress:    true,
    center:      false,
    width:       1100,
    height:      700,
    margin:      0.04,
  });
})();
</script>
</body>
</html>
