{{ define "main" }}
<header class="page-header">
  <h1>{{ .Title }}</h1>
  {{ with .Description }}<p class="section-intro">{{ . }}</p>{{ end }}
</header>

<div class="article-body">
  <h2>Links</h2>
  <ul>
    <li><a href="{{ site.Params.github }}" target="_blank" rel="noopener noreferrer">GitHub</a></li>
    <li><a href="{{ site.Params.linkedin }}" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
    {{ with site.Params.hackthebox }}
    <li><a href="{{ . }}" target="_blank" rel="noopener noreferrer">Hack The Box</a></li>
    {{ end }}
  </ul>

  {{ .Content }}
</div>
{{ end }}
