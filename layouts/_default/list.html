{{ define "main" }}
<header class="page-header">
  <h1>{{ .Title }}</h1>
  {{ with .Description }}<p class="section-intro">{{ . }}</p>{{ end }}
</header>

{{ with .Content }}
<div class="article-body" style="margin-bottom: 2rem;">
  {{ . }}
</div>
{{ end }}

<div class="content-list">
  {{ range .Pages }}
    {{ partial "card.html" . }}
  {{ end }}
</div>
{{ end }}
