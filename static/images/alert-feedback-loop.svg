<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" fill="#0d1117" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" fill="#e6edf3" font-size="16" font-weight="bold" text-anchor="middle">Alert Investigation Feedback Loop</text>

  <!-- Alert Investigated (start) -->
  <rect x="300" y="55" width="200" height="40" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="400" y="80" fill="#e6edf3" font-size="13" font-weight="bold" text-anchor="middle">Alert Investigated</text>

  <!-- Arrow down from start -->
  <line x1="400" y1="95" x2="400" y2="125" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision diamond (simplified as rectangle) -->
  <rect x="310" y="125" width="180" height="36" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="400" y="148" fill="#8b949e" font-size="12" text-anchor="middle">Classification?</text>

  <!-- Three branches -->
  <!-- Left: True Positive -->
  <line x1="310" y1="143" x2="130" y2="143" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="130" y1="143" x2="130" y2="195" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Center: False Positive -->
  <line x1="400" y1="161" x2="400" y2="195" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Right: Inconclusive -->
  <line x1="490" y1="143" x2="670" y2="143" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="670" y1="143" x2="670" y2="195" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- TRUE POSITIVE branch -->
  <rect x="40" y="195" width="180" height="36" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="130" y="218" fill="#3fb950" font-size="12" font-weight="bold" text-anchor="middle">True Positive</text>

  <line x1="130" y1="231" x2="130" y2="260" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="260" width="180" height="32" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="130" y="281" fill="#8b949e" font-size="11" text-anchor="middle">Can response be automated?</text>

  <!-- TP Yes branch -->
  <line x1="80" y1="292" x2="80" y2="325" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="68" y="315" fill="#8b949e" font-size="10">Yes</text>

  <rect x="10" y="325" width="140" height="44" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
  <text x="80" y="344" fill="#e6edf3" font-size="11" text-anchor="middle">Build automated</text>
  <text x="80" y="359" fill="#e6edf3" font-size="11" text-anchor="middle">response playbook</text>

  <!-- TP No branch -->
  <line x1="180" y1="292" x2="180" y2="325" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="186" y="315" fill="#8b949e" font-size="10">No</text>

  <rect x="155" y="325" width="140" height="44" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1"/>
  <text x="225" y="344" fill="#e6edf3" font-size="11" text-anchor="middle">Document</text>
  <text x="225" y="359" fill="#e6edf3" font-size="11" text-anchor="middle">investigation runbook</text>

  <!-- FALSE POSITIVE branch -->
  <rect x="310" y="195" width="180" height="36" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="400" y="218" fill="#f85149" font-size="12" font-weight="bold" text-anchor="middle">False Positive</text>

  <line x1="400" y1="231" x2="400" y2="260" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="310" y="260" width="180" height="32" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="400" y="281" fill="#8b949e" font-size="11" text-anchor="middle">Why did it fire?</text>

  <!-- FP sub-branches -->
  <line x1="340" y1="292" x2="340" y2="325" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="305" y="325" width="90" height="44" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1"/>
  <text x="350" y="344" fill="#e6edf3" font-size="10" text-anchor="middle">Wrong scope</text>
  <text x="350" y="358" fill="#8b949e" font-size="9" text-anchor="middle">→ Tighten rule</text>

  <line x1="400" y1="292" x2="400" y2="325" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="395" y="325" width="90" height="44" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1"/>
  <text x="440" y="344" fill="#e6edf3" font-size="10" text-anchor="middle">Overlap</text>
  <text x="440" y="358" fill="#8b949e" font-size="9" text-anchor="middle">→ Merge rules</text>

  <line x1="460" y1="292" x2="520" y2="325" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="490" y="325" width="90" height="44" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1"/>
  <text x="535" y="344" fill="#e6edf3" font-size="10" text-anchor="middle">Too broad</text>
  <text x="535" y="358" fill="#8b949e" font-size="9" text-anchor="middle">→ Add threshold</text>

  <!-- INCONCLUSIVE branch -->
  <rect x="580" y="195" width="180" height="36" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <text x="670" y="218" fill="#d29922" font-size="12" font-weight="bold" text-anchor="middle">Inconclusive</text>

  <line x1="670" y1="231" x2="670" y2="260" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="580" y="260" width="180" height="32" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="670" y="281" fill="#8b949e" font-size="11" text-anchor="middle">What data was missing?</text>

  <line x1="670" y1="292" x2="670" y2="325" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="600" y="325" width="140" height="44" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1"/>
  <text x="670" y="344" fill="#e6edf3" font-size="11" text-anchor="middle">Add log source</text>
  <text x="670" y="359" fill="#e6edf3" font-size="11" text-anchor="middle">or enrichment</text>

  <!-- Bottom: All paths lead to improvement -->
  <line x1="80" y1="369" x2="80" y2="420" stroke="#8b949e" stroke-width="1" stroke-dasharray="4"/>
  <line x1="225" y1="369" x2="225" y2="420" stroke="#8b949e" stroke-width="1" stroke-dasharray="4"/>
  <line x1="350" y1="369" x2="350" y2="420" stroke="#8b949e" stroke-width="1" stroke-dasharray="4"/>
  <line x1="440" y1="369" x2="440" y2="420" stroke="#8b949e" stroke-width="1" stroke-dasharray="4"/>
  <line x1="535" y1="369" x2="535" y2="420" stroke="#8b949e" stroke-width="1" stroke-dasharray="4"/>
  <line x1="670" y1="369" x2="670" y2="420" stroke="#8b949e" stroke-width="1" stroke-dasharray="4"/>

  <!-- Convergence bar -->
  <line x1="60" y1="420" x2="740" y2="420" stroke="#58a6ff" stroke-width="1.5"/>

  <line x1="400" y1="420" x2="400" y2="455" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Result box -->
  <rect x="250" y="455" width="300" height="45" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="400" y="475" fill="#58a6ff" font-size="13" font-weight="bold" text-anchor="middle">System Improves</text>
  <text x="400" y="492" fill="#8b949e" font-size="11" text-anchor="middle">Next alert of this type is higher quality</text>
</svg>
